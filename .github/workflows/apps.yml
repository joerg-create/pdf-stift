name: Apps bauen

# Startet bei einem Versions-Tag (z. B. v1.0.1) oder von Hand unter „Actions“.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      plattform:
        description: 'Was bauen?'
        type: choice
        options: [alle, desktop, ios]
        default: alle

permissions:
  contents: write

jobs:
  desktop:
    name: ${{ matrix.name }}
    if: github.event_name != 'workflow_dispatch' || inputs.plattform != 'ios'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ''
          - name: macOS
            os: macos-latest
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run prepare-dist
        shell: bash
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: PDF Stift v__VERSION__
          releaseBody: |
            **Windows:** `PDF.Stift_..._x64-setup.exe` herunterladen und ausführen.
            **Mac:** `PDF.Stift_..._universal.dmg` herunterladen, öffnen, App in „Programme“ ziehen.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  ios:
    name: iPad/iPhone (TestFlight)
    if: github.event_name != 'workflow_dispatch' || inputs.plattform != 'desktop'
    runs-on: macos-latest
    env:
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Apple-Zugang vorhanden?
        id: check
        env:
          P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          missing=""
          [ -n "$APPLE_API_ISSUER" ] || missing="$missing APPLE_API_ISSUER"
          [ -n "$APPLE_API_KEY" ] || missing="$missing APPLE_API_KEY_ID"
          [ -n "$P8" ] || missing="$missing APPLE_API_KEY_P8"
          [ -n "$APPLE_DEVELOPMENT_TEAM" ] || missing="$missing APPLE_TEAM_ID"
          if [ -z "$missing" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "::warning::Fehlende Apple-Secrets:$missing (iOS wird übersprungen)"; fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ok == 'true'
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        if: steps.check.outputs.ok == 'true'
        with:
          targets: aarch64-apple-ios
      - uses: swatinem/rust-cache@v2
        if: steps.check.outputs.ok == 'true'
        with:
          workspaces: src-tauri
      - name: Vorbereiten
        if: steps.check.outputs.ok == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          npm ci
          npm run prepare-dist
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$APPLE_API_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY}.p8
          echo "APPLE_API_KEY_PATH=$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY}.p8" >> "$GITHUB_ENV"
          npx tauri ios init --ci
      - name: Zertifikat und Profil für diesen Lauf anlegen
        if: steps.check.outputs.ok == 'true'
        env:
          BUNDLE_ID: de.pdfstift.app
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography
          python3 .github/scripts/asc_signing.py create
      - name: Bauen
        if: steps.check.outputs.ok == 'true'
        run: npx tauri ios build --ci --export-method app-store-connect --build-number ${{ github.run_number }}
      - name: Zu TestFlight hochladen
        if: steps.check.outputs.ok == 'true'
        run: |
          IPA=$(find src-tauri/gen/apple/build -name '*.ipa' | head -1)
          echo "IPA: $IPA"
          xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$APPLE_API_KEY" --apiIssuer "$APPLE_API_ISSUER"
      - name: Zertifikat und Profil wieder entfernen
        if: always() && steps.check.outputs.ok == 'true'
        run: python3 .github/scripts/asc_signing.py cleanup
